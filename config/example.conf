# config/example.conf
# Auto-mode configuration for the Gentoo installer
# Lines starting with # are ignored.

# Disk
TARGET_DISK="/dev/sda"
EFI_SIZE="512M"
SWAP_SIZE="4G"
FILESYSTEM="ext4"

# Network
CONNECTIVITY="require_network"   # require_network | allow_offline
BINHOST_MIRROR=""                # empty = skip, or URL to binhost dir

# Portage / CPU
COMMON_FLAGS="-O2 -march=native -pipe"
ACCEPT_LICENSE="*"

# Stage3
STAGE3_URL="https://distfiles.gentoo.org/releases/amd64/autobuilds/current-stage3-openrc/"

# Timezone / Locale
TIMEZONE="UTC"
LOCALE="en_US.UTF-8"
LANG="en_US.UTF-8"
KEYMAP="us"

# Identity
HOSTNAME="gentoo"
ROOT_PASSWORD="changeme"
USERNAME="speed"
USER_PASSWORD="changeme"
SUDOERS="%wheel ALL=(ALL:ALL) NOPASSWD: ALL"

# Bootloader
BOOTLOADER="grub"              # grub | systemd-boot

# Desktop
INSTALL_DESKTOP="dwm"          # dwm | sway | xfce4 | gnome | kde | none
DESKTOP_WITH_POLYBAR="true"
WALLPAPER_URL="https://your-host/example.com/wallpaper.jpg"
